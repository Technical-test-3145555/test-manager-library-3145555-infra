name: manager-library

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - library_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - library_net

  api:
    build:
      context: ${API_CONTEXT:-../test-manager-library-3145555-api}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: pgsql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SCHEMA: library
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      COVERS_DIR: /var/www/storage/app/covers
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - library_covers:/var/www/storage/app/covers
    networks:
      - library_net

  app:
    build:
      context: ${APP_CONTEXT:-../test-manager-library-3145555-app}
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL in .env}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${APP_PORT:-5173}:80"
    networks:
      - library_net

volumes:
  library_pgdata:
  library_covers:

networks:
  library_net:
